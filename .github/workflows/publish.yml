name: Publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches manifest and APWorld versions
        run: python tools/build.py --check-tag "$GITHUB_REF_NAME"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            dist/ViMaSter-MultiworldGGShop.zip dist/pathogenic.apworld dist/SHA256SUMS

  steam-workshop:
    needs: build
    runs-on: ubuntu-latest
    # Protect this environment with required reviewers; it holds the Steam login.
    environment:
      name: steam
      url: https://steamcommunity.com/sharedfiles/filedetails/?id=${{ vars.STEAM_WORKSHOP_ITEM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          ITEM_ID: ${{ vars.STEAM_WORKSHOP_ITEM_ID }}
          HAS_USERNAME: ${{ secrets.STEAM_USERNAME != '' }}
          HAS_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF != '' }}
        run: |
          [[ "$ITEM_ID" =~ ^[0-9]+$ ]] || { echo "::error::Set the steam environment variable STEAM_WORKSHOP_ITEM_ID (create the item once with tools/workshop_vdf.py)."; exit 1; }
          [[ "$HAS_USERNAME" == true && "$HAS_CONFIG_VDF" == true ]] || { echo "::error::Set the steam environment secrets STEAM_USERNAME and STEAM_CONFIG_VDF."; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Workshop content is exactly the mod ZIP
        run: |
          test "$(ls -A dist/workshop)" = "ViMaSter-MultiworldGGShop.zip"
          cmp dist/workshop/ViMaSter-MultiworldGGShop.zip dist/ViMaSter-MultiworldGGShop.zip

      - name: Upload to Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          ITEM_ID: ${{ vars.STEAM_WORKSHOP_ITEM_ID }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          steam_dir="$RUNNER_TEMP/steamcmd"
          steam_config="$HOME/Steam/config/config.vdf"
          mkdir -p "$steam_dir" "$(dirname "$steam_config")"
          trap 'rm -f "$steam_config"' EXIT
          curl -fsSLo "$RUNNER_TEMP/steamcmd.tar.gz" \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$steam_dir"
          umask 077
          printf '%s' "$STEAM_CONFIG_VDF" > "$steam_config"
          python3 tools/workshop_vdf.py --item-id "$ITEM_ID" --visibility private \
            --note "$GITHUB_REF_NAME: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/workshop.vdf"
          "$steam_dir/steamcmd.sh" +login "$STEAM_USERNAME" \
            +workshop_build_item "$RUNNER_TEMP/workshop.vdf" +quit \
            2>&1 | tee "$RUNNER_TEMP/workshop-upload.log"
          grep -E "Committing update.*Success[.]|Success[.] Published Item $ITEM_ID" \
            "$RUNNER_TEMP/workshop-upload.log"
