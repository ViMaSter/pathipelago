name: Pathogenic{number}   # slot name; {number} becomes 1, 2, ... (Pathogenic1)
game: Pathogenic
description: Persistent numbered remote unlocks across repeatable runs.
Pathogenic:
  progression_balancing: 50  # ignored: every location is always reachable
  accessibility: full        # ignored: native feats are optional, never logic gates

  # Share deaths in both directions. Paused/editor runs die when gameplay resumes.
  death_link: true

  # where you can unlock things
  shop_unlocks: false        # one coin pedestal in every shop
  item_room_unlocks: true    # one free pedestal in every blue item room
  boss_reward_unlocks: false # one choice of every boss bodypart reward
  level_up_unlocks: false    # last card of every level-up mutation draft

  # Start with the full roster and omit character items and checks.
  start_with_all_characters: false

  # things other people can unlock
  remote_characters: true
  remote_plasmids: false
  remote_loadouts: true
  remote_organelles: true
  remote_environment: false
  
  # Additional filler checks (0-10000 each):
  # Amount of times other player can grant coins
  coin_checks: 0
  # Amount of coins granted by each coin check
  coin_amount: 15
  # Amount of times other player can grant DNA
  dna_checks: 0
  # Amount of DNA granted by each DNA check
  dna_amount: 1
  # Amount of times other player can grant plasmid fragments
  plasmid_fragment_checks: 0
  # Amount of plasmid fragments granted by each plasmid fragment check
  plasmid_fragment_amount: 1

  # Multiworld-run victories required in addition to sending every check (0-50).
  required_victories: 0
